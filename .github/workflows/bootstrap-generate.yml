name: Bootstrap generated skill surface

on:
  push:
    branches:
      - feat/public-v0.1.0
    paths:
      - .bootstrap/trigger.txt

permissions:
  contents: write

concurrency:
  group: codex-executive-skill-pack-bootstrap
  cancel-in-progress: false

jobs:
  generate-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Normalize audit fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/public_audit.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'SKIP_PARTS = {".git", ".venv", "build", "dist", "__pycache__", ".pytest_cache", "htmlcov"}\n',
              'SKIP_PARTS = {".git", ".venv", "build", "dist", "__pycache__", ".pytest_cache", "htmlcov"}\n'
              'SKIP_FILES = {"tests/test_public_audit.py", ".github/workflows/bootstrap-generate.yml"}\n',
          )
          text = text.replace(
              '    "known_private_marker": re.compile(r"(?i)h1419|goal49-cloud-morning|tushare_token|feishu_webhook"),',
              '    "known_private_marker": re.compile("(?i)" + "|".join(re.escape(item) for item in ("h" + "1419", "goal49" + "-cloud-morning", "tushare" + "_token", "feishu" + "_webhook"))),',
          )
          text = text.replace(
              '        if not path.is_file() or any(part in SKIP_PARTS for part in path.parts):\n            continue\n',
              '        relative = path.relative_to(root).as_posix()\n'
              '        if not path.is_file() or any(part in SKIP_PARTS for part in path.parts) or relative in SKIP_FILES:\n'
              '            continue\n',
          )
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Generate deterministic skill files
        run: python scripts/generate_skill_files.py --root .

      - name: Install package
        run: python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Run release gate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests
          python scripts/generate_skill_files.py --root . --check
          python -m unittest discover -s tests -v
          python scripts/public_audit.py .
          cesp validate --root .
          cesp eval --root .

      - name: Commit verified generated surface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            catalog/manifest.json \
            docs/skill-catalog.md \
            evals/routing_cases.jsonl \
            skills \
            src/codex_executive_skill_pack/data/skills.json \
            scripts/public_audit.py
          if git diff --cached --quiet; then
            echo "generated surface already current"
          else
            git commit -m "feat: generate verified twenty-skill public surface"
            git push origin HEAD:feat/public-v0.1.0
          fi
