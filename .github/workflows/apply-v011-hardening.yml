name: Apply v0.1.1 Audit Hardening

on:
  push:
    branches:
      - fix/v0.1.1-audit-hardening
    paths:
      - .github/workflows/apply-v011-hardening.yml

permissions:
  contents: write

concurrency:
  group: codex-executive-skill-pack-v011-hardening
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v0.1.1-audit-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: ""

      - name: Apply deterministic patch
        run: python scripts/apply_v011_hardening_once.py

      - name: Regenerate references and run release gate
        run: |
          python scripts/generate_reference.py --root .
          python -m compileall -q src scripts tests
          python scripts/run_release_gate.py

      - name: Commit audited source changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-v011-hardening.yml
          rm -f scripts/apply_v011_hardening_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]"@"users.noreply.github.com"
          git add -A
          git commit -m "fix: harden routing installer and release integrity"
          git push origin HEAD:fix/v0.1.1-audit-hardening
