name: Bootstrap public v0.1.0

on:
  push:
    branches: [feat/public-v0.1.0]
    paths:
      - ".bootstrap/trigger.txt"

permissions:
  contents: write

concurrency:
  group: codex-executive-skill-pack-bootstrap-v010
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src

    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.tar.xz.b64.part-* \
            | base64 --decode > "$RUNNER_TEMP/source.tar.xz"
          printf '%s  %s\n' \
            '2a986255081a0d8bb92879406f6b6f1533d7f546094766850ff9bbd4381a2ea4' \
            "$RUNNER_TEMP/source.tar.xz" \
            | sha256sum -c -

      - name: Safely extract source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/source.tar.xz" \
          DEST="$RUNNER_TEMP/source-tree" \
          python - <<'PY'
          import os
          import tarfile
          from pathlib import Path

          archive = Path(os.environ["ARCHIVE"])
          destination = Path(os.environ["DEST"])
          destination.mkdir(parents=True, exist_ok=True)
          root = destination.resolve()
          with tarfile.open(archive, "r:xz") as handle:
              for member in handle.getmembers():
                  candidate = (destination / member.name).resolve()
                  if candidate != root and root not in candidate.parents:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"archive links are not allowed: {member.name}")
              handle.extractall(destination, filter="data")
          PY

      - name: Install verified non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "$RUNNER_TEMP/source-tree/" ./

      - name: Run zero-install release gate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests
          python -m unittest discover -s tests -v
          python -m executive_skill_pack validate --root . --strict
          python -m executive_skill_pack eval --root .
          python scripts/generate_reference.py --root . --check
          python scripts/check_docs.py --root .
          python scripts/public_audit.py .
          python scripts/run_release_gate.py

      - name: Commit readable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish audited 20-skill executive pack"
          git push origin HEAD:feat/public-v0.1.0
