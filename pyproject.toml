[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-executive-skill-pack"
version = "0.1.0"
description = "Twenty modular, safety-aware Codex skill contracts with deterministic routing and evaluations."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "JINGJAYHUANG"}]
keywords = ["codex", "agent-skills", "routing", "evaluation", "automation-safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]
dependencies = []

[project.scripts]
cesp = "codex_executive_skill_pack.cli:main"

[project.urls]
Repository = "https://github.com/JINGJAYHUANG/codex-executive-skill-pack"
Issues = "https://github.com/JINGJAYHUANG/codex-executive-skill-pack/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_executive_skill_pack = ["data/*.json"]
